<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Light Mode Gradient -->
    <linearGradient id="grad-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <!-- Dark Mode Gradient -->
    <linearGradient id="grad-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <style>
    .bg-rect {
      fill: url(#grad-light);
    }
    .inner-rect {
      fill: #ffffff;
    }
    .star-shape {
      stroke: #0ea5e9;
      fill: none;
    }
    .circle-shape {
      fill: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      .bg-rect {
        fill: url(#grad-dark);
      }
      .inner-rect {
        fill: #0f172a;
      }
      .star-shape {
        stroke: #38bdf8;
      }
      .circle-shape {
        fill: #818cf8;
      }
    }
  </style>
  <!-- Outer rounded square with gradient border -->
  <rect class="bg-rect" x="0" y="0" width="32" height="32" rx="9" />
  <!-- Inner square to match branding -->
  <rect class="inner-rect" x="1.5" y="1.5" width="29" height="29" rx="7.5" />
  <!-- Center Star/Compass Icon -->
  <g transform="translate(4, 4)">
    <polygon class="star-shape" points="12 2 15 9 22 12 15 15 12 22 9 15 2 12 9 9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle class="circle-shape" cx="12" cy="12" r="1.5" />
  </g>
</svg>
